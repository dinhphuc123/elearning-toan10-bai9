"use strict";
/* ---------- SCORM 1.2 wrapper + localStorage fallback ---------- */
var SCORM = (function(){
  var api = null, active = false;
  function find(w){ var n=0; while(w && n<500){ if(w.API) return w.API; if(w.parent && w.parent!==w) w=w.parent; else break; n++; } return null; }
  function init(){
    try{ api = find(window); if(!api && window.opener) api = find(window.opener); }catch(e){}
    if(api){ try{ active = (api.LMSInitialize("") === "true" || api.LMSInitialize("") === true); }catch(e){ active=false; } }
    return active;
  }
  function get(k){ if(active){ try{ return api.LMSGetValue(k); }catch(e){ return ""; } } return ""; }
  function set(k,v){ if(active){ try{ api.LMSSetValue(k, String(v)); }catch(e){} } }
  function save(){ if(active){ try{ api.LMSCommit(""); }catch(e){} } }
  function finish(){ if(active){ try{ api.LMSFinish(""); }catch(e){} active=false; } }
  return {init:init, get:get, set:set, save:save, finish:finish, isActive:function(){return active;}};
})();
/* ---------- Trang thai ---------- */
var KEY = "bai9_elearning_v2_gk";
var S = { cur:0, max:17, done:{}, pred:null, conf03:null, reflection:"", selfcheck:false, plan16:null, planEff:null, err:null, readGoals:false, tier:"G", diag:-1, vstops:{}, ch13:{tier:"G", pct:1}, challenge:true, ai:0,
          test:{attempts:0, best:-1, passed:false, first:-1, lastItems:null, note:""} };
function persist(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
  if(SCORM.isActive()){ try{ SCORM.set("cmi.core.suspend_data", JSON.stringify(S).slice(0,4000)); SCORM.save(); }catch(e){} }
}
function restore(){
  var raw = null;
  if(SCORM.isActive()){ raw = SCORM.get("cmi.core.suspend_data"); }
  if(!raw){ try{ raw = localStorage.getItem(KEY); }catch(e){} }
  if(raw){ try{ var o = JSON.parse(raw); if(o && typeof o.cur === "number"){ for(var k in S){ if(o[k] !== undefined) S[k] = o[k]; } } }catch(e){} }
}
/* ---------- KaTeX ---------- */
function K(tex){ return "\\(" + tex + "\\)"; }
function renderK(el){
  if(window.renderMathInElement && el){
    try{ renderMathInElement(el, { delimiters:[{left:"\\(", right:"\\)", display:false}] }); }catch(e){}
  }
}
function V1(t){ return K("\\vec{" + t + "}"); }
function OV(t){ return K("\\overrightarrow{" + t + "}"); }
function LEN(t){ return K("\\left|" + t + "\\right|"); }

<script>
"use strict";
/* ---------- Tien ich tuong tac ---------- */
function $(id){ return document.getElementById(id); }
function markDone(id){ if(!S.done[id]){ S.done[id]=true; persist(); renderMenu(); updateNav(); } }
function fb(el, ok, html){ if(!el) return; el.className = "fb " + (ok ? "ok" : "no"); el.innerHTML = html; renderK(el); }
function mcq(boxId, fbId, opts, correct, fbOk, fbNo, onDone){
  var box = $(boxId), f = $(fbId), picked = -1;
  if(!box) return;
  box.innerHTML = "";
  opts.forEach(function(t, i){
    var b = document.createElement("button"); b.className = "opt"; b.innerHTML = t;
    b.onclick = function(){
      if(picked === correct) return;
      picked = i;
      box.querySelectorAll(".opt").forEach(function(x){ x.classList.remove("sel","right","wrong"); });
      if(i === correct){ b.classList.add("right"); fb(f, true, fbOk); if(onDone) onDone(); }
      else { b.classList.add("wrong"); fb(f, false, fbNo); }
    };
    box.appendChild(b);
  });
}
function narr(t, ak){ return '<div class="narr"' + (ak ? ' data-audio="audio/' + ak + '.mp3"' : '') + '><div class="narrtxt">' + t + '</div><button class="btn ghost speakbtn" type="button">Nghe đọc lời dẫn</button></div>'; }
function speakNarr(btn){
  if(!window.speechSynthesis){ showToast("Thiết bị này không hỗ trợ giọng đọc."); return; }
  var box = btn.closest(".narr"); if(!box) return;
  var clone = box.cloneNode(true);
  clone.querySelectorAll(".katex-mathml, button").forEach(function(n){ n.remove(); });
  var txt = clone.textContent.replace(/([A-Za-z])\u20D7/g, " véc tơ $1 ").replace(/\s+/g, " ").trim();
  if(!txt) return;
  speechSynthesis.cancel();
  var u = new SpeechSynthesisUtterance(txt); u.lang = "vi-VN"; u.rate = 0.95;
  var vs = speechSynthesis.getVoices();
  for(var i = 0; i < vs.length; i++){ if(vs[i].lang && vs[i].lang.indexOf("vi") === 0){ u.voice = vs[i]; break; } }
  speechSynthesis.speak(u);
}
function head(code, phase, title){ return '<span class="phase">' + code + ' · ' + phase + '</span><h1>' + title + '</h1>'; }
function numVal(id){ var el = $(id); if(!el) return NaN; return parseFloat(String(el.value).replace(",", ".")); }
function TB(y, tbk, g){ return S.tier === "Y" ? y : (S.tier === "G" ? g : tbk); }
function tierName(){ return S.tier === "Y" ? "Khởi động" : (S.tier === "G" ? "Bứt phá" : "Tăng tốc"); }
function updateTierBadge(){
  var b = $("tierbadge");
  if(S.tier){ b.style.display = "inline-block"; b.textContent = "Chặng: " + tierName(); } else b.style.display = "none";
}
/* --- Sap xep the theo thu tu (bam theo thu tu dung) --- */
/* --- Keo tha bang Pointer Events: chuot tren may tinh + tay tren dien thoai/tablet.
   Giu nguyen cach cham chon -> cham dat (onclick) lam du phong. --- */
function enableDrag(el, opts){
  if(!window.PointerEvent) return;
  var pid = null, sx = 0, sy = 0, dragging = false, ghost = null, curTarget = null;
  function clearHover(){ if(curTarget){ curTarget.classList.remove("hover"); curTarget = null; } }
  el.addEventListener("pointerdown", function(e){
    if(el.classList.contains("used") || el.classList.contains("picked")) return;
    pid = e.pointerId; sx = e.clientX; sy = e.clientY; dragging = false;
    try{ el.setPointerCapture(pid); }catch(_){}
  });
  el.addEventListener("pointermove", function(e){
    if(e.pointerId !== pid) return;
    if(!dragging){
      if(Math.hypot(e.clientX - sx, e.clientY - sy) < 8) return;
      dragging = true;
      ghost = el.cloneNode(true); ghost.classList.add("dragghost"); ghost.classList.remove("sel");
      ghost.style.width = el.offsetWidth + "px";
      document.body.appendChild(ghost); el.classList.add("dragsrc");
    }
    ghost.style.left = e.clientX + "px"; ghost.style.top = e.clientY + "px";
    var ok = null;
    if(opts.targets){
      var list = opts.targets();
      for(var i = 0; i < list.length; i++){
        var r = list[i].getBoundingClientRect();
        if(e.clientX >= r.left - 6 && e.clientX <= r.right + 6 && e.clientY >= r.top - 6 && e.clientY <= r.bottom + 6){ ok = list[i]; break; }
      }
    }
    if(ok !== curTarget){ clearHover(); if(ok){ ok.classList.add("hover"); curTarget = ok; } }
    e.preventDefault();
  });
  function finish(e){
    if(e.pointerId !== pid) return;
    var was = dragging, target = curTarget;
    if(ghost){ ghost.remove(); ghost = null; }
    el.classList.remove("dragsrc"); clearHover(); dragging = false; pid = null;
    if(was && opts.drop) opts.drop(target);
  }
  el.addEventListener("pointerup", finish);
  el.addEventListener("pointercancel", finish);
}
/* --- Sap xep thu tu bang RE KEO len/xuong (chuot + cam ung), bam nut Kiem tra de cham --- */
function attachSortDrag(chip, box, isDone){
  var pid = null, startY = 0, lastY = 0, dragging = false, ghost = null;
  chip.addEventListener("pointerdown", function(e){
    if(isDone() || chip.classList.contains("picked")) return;
    pid = e.pointerId; startY = e.clientY; lastY = e.clientY; dragging = false;
    document.addEventListener("pointermove", onMove);
    document.addEventListener("pointerup", finish);
    document.addEventListener("pointercancel", finish);
  });
  function onMove(e){
    if(e.pointerId !== pid) return;
    if(!dragging){
      if(Math.abs(e.clientY - startY) < 8) return;
      dragging = true;
      ghost = chip.cloneNode(true); ghost.classList.add("dragghost"); ghost.classList.remove("picked");
      ghost.style.width = chip.offsetWidth + "px";
      document.body.appendChild(ghost); chip.classList.add("dragsrc");
    }
    var r0 = chip.getBoundingClientRect();
    ghost.style.left = (r0.left + r0.width / 2) + "px";
    ghost.style.top = e.clientY + "px";
    var all = Array.prototype.slice.call(box.querySelectorAll(".chip"));
    var cur = all.indexOf(chip);
    var sibs = all.filter(function(c){ return c !== chip; });
    var dest = sibs.length;
    var movingUp = e.clientY <= lastY;
    for(var i = 0; i < sibs.length; i++){
      var r = sibs[i].getBoundingClientRect();
      var mid = r.top + r.height / 2;
      if(movingUp ? e.clientY <= mid : e.clientY < mid){ dest = i; break; }
    }
    lastY = e.clientY;
    if(dest !== cur){
      if(dest >= sibs.length) box.appendChild(chip); else box.insertBefore(chip, sibs[dest]);
    }
    e.preventDefault();
  }
  function finish(e){
    if(e.pointerId !== pid) return;
    if(ghost){ ghost.remove(); ghost = null; }
    chip.classList.remove("dragsrc"); dragging = false; pid = null;
    document.removeEventListener("pointermove", onMove);
    document.removeEventListener("pointerup", finish);
    document.removeEventListener("pointercancel", finish);
  }
}
function sortChips(boxId, fbId, steps, displayOrder, fbOk, onDone, hooks){
  var box = $(boxId); if(!box) return;
  var done = false;
  box.innerHTML = "";
  box.classList.add("sortbox");
  displayOrder.forEach(function(si){
    var b = document.createElement("button"); b.className = "chip"; b.innerHTML = steps[si]; b.dataset.step = si;
    box.appendChild(b);
  });
  renderK(box);
  var fbEl = $(fbId);
  var btn = document.createElement("button"); btn.className = "btn checkord"; btn.textContent = "Kiểm tra thứ tự";
  if(fbEl && fbEl.parentNode) fbEl.parentNode.insertBefore(btn, fbEl); else box.parentNode.appendChild(btn);
  btn.onclick = function(){
    if(done) return;
    var chips = Array.prototype.slice.call(box.querySelectorAll(".chip"));
    var order = chips.map(function(c){ return parseInt(c.dataset.step, 10); });
    var okAll = order.every(function(v, i){ return v === i; });
    if(hooks && hooks.onAttempt) hooks.onAttempt(okAll);
    if(okAll){
      done = true; btn.disabled = true;
      chips.forEach(function(c, i){ c.classList.add("picked"); c.innerHTML = "<b>" + (i + 1) + ".</b> " + steps[parseInt(c.dataset.step, 10)]; renderK(c); });

    }
  };

  });
}
/* --- Ghep the vao o trong (cham the -> cham o) --- */
function matchDnD(prefix, slots, chips, onDone){
  var selChip = null, filled = 0, suppress = false;
  var bank = $(prefix + "_bank"), sbox = $(prefix + "_slots");
  if(!bank || !sbox) return;
  bank.innerHTML = ""; sbox.innerHTML = "";
  if(!document.getElementById(prefix + "_hint")){
    var hint = document.createElement("p"); hint.className = "dhint"; hint.id = prefix + "_hint";
    hint.textContent = "Cách làm: kéo thẻ thả vào ô trống — hoặc bấm chọn thẻ rồi bấm vào ô cần điền.";
    bank.insertAdjacentElement("afterend", hint);
  }
  function selectChip(c, b){
    bank.querySelectorAll(".tchip").forEach(function(x){ x.classList.remove("sel"); });
    selChip = c.id; if(b) b.classList.add("sel");
  }
  function placeOnSlot(sl, chipId){
    if(sl.classList.contains("filled")) return;
    if(!chipId){ fb($(prefix + "_fb"), false, "Hãy kéo một thẻ từ ngân hàng thẻ vào ô này — hoặc chạm chọn thẻ rồi chạm vào ô cần điền."); return; }
    if(chipId === sl.dataset.need){
      sl.classList.add("filled"); sl.innerHTML = chips.filter(function(c){ return c.id === chipId; })[0].html; renderK(sl);
      var ch = bank.querySelector('[data-cid="' + chipId + '"]'); if(ch) ch.classList.add("used");
      if(selChip === chipId){ selChip = null; bank.querySelectorAll(".tchip").forEach(function(x){ x.classList.remove("sel"); }); }
      filled++;
      fb($(prefix + "_fb"), true, filled === slots.length ? "Hoàn thành! Em đã ghép đúng tất cả các ô." : "Đúng rồi! Còn " + (slots.length - filled) + " ô nữa.");
      if(filled === slots.length && onDone) onDone();
    } else {
      sl.classList.add("bad");
      fb($(prefix + "_fb"), false, "Thẻ đó chưa khớp với ô này. Hãy đọc lại yêu cầu của ô rồi chọn thẻ khác.");
      setTimeout(function(){ sl.classList.remove("bad"); }, 700);
    }
  }
  chips.forEach(function(c){
    var b = document.createElement("button"); b.className = "tchip"; b.innerHTML = c.html; b.dataset.cid = c.id;
    b.onclick = function(){ if(suppress) return; selectChip(c, b); };
    enableDrag(b, {
      targets: function(){ return Array.prototype.slice.call(sbox.querySelectorAll(".slot:not(.filled)")); },
      drop: function(target){ suppress = true; setTimeout(function(){ suppress = false; }, 350); if(target) placeOnSlot(target, c.id); }
    });
    bank.appendChild(b);
  });
  slots.forEach(function(s){
    var row = document.createElement("div"); row.className = "dndrow";
    row.innerHTML = '<div class="lab2">' + s.label + '</div>';
    var sl = document.createElement("button"); sl.className = "slot"; sl.textContent = "Kéo thẻ vào đây"; sl.dataset.need = s.need;
    sl.onclick = function(){ if(suppress) return; placeOnSlot(sl, selChip); };
    row.appendChild(sl); sbox.appendChild(row);
  });
}

<script>

SCREENS.push({ id:"mh13", code:"MH-13", title:"Luyện tập theo chặng", gate:function(){ return !!S.ch13; },
  html:function(){ return head("MH-13","Hồi 4 · Elaborate","Luyện tập theo chặng")
    + narr("Ai cũng có phần việc vừa sức mình — và ai cũng có quyền thử thách ở chặng tiếp theo. Bộ câu hỏi được chấm theo lần trả lời đúng đầu tiên của mỗi câu.", "mh13")
    + '<p>Tầng hiện tại của em: <b id="curtier"></b></p><div class="tiers" id="switchbox"></div>'
    + '<div id="setbox"></div><div id="setresult"></div>'; },
  setup:function(){
    var curSet = S.tier || "TBK";
    function renderSwitch(){
      $("curtier").textContent = tierName() + " (bộ đang làm: " + (curSet === "Y" ? "Khởi động" : curSet === "G" ? "Bứt phá" : "Tăng tốc") + ")";
      var h = "";
      [["Y","Khởi động"],["TBK","Tăng tốc"],["G","Bứt phá"]].forEach(function(p){
        h += '<button class="tier' + (curSet === p[0] ? " cur" : "") + '" data-t="' + p[0] + '"><b>' + p[1] + '</b><br>Làm bộ câu hỏi của chặng này</button>';
      });
      $("switchbox").innerHTML = h;
      document.querySelectorAll("#switchbox .tier").forEach(function(b){
        b.onclick = function(){ curSet = b.dataset.t; S.tier = curSet; persist(); updateTierBadge(); renderSwitch(); renderSet(); };
      });
    }
    function finishSet(rep){
      var pct = rep.first / 4;
      S.ch13 = { tier: curSet, pct: pct }; persist(); markDone("mh13");
      var sug = "";
      if(pct >= 0.8 && curSet !== "G") sug = "Em làm rất tốt (đúng ngay lần đầu " + rep.first + "/4 câu). Hệ thống gợi ý: lần luyện sau hãy thử bộ của chặng tiếp theo.";
      else if(pct < 0.5) sug = "Đúng ngay lần đầu " + rep.first + "/4 câu. Hệ thống gợi ý: em nên ôn lại ở bộ của chặng trước, hoặc xem lại các video V2–V5 trước khi làm tiếp.";
      else sug = "Đúng ngay lần đầu " + rep.first + "/4 câu. Em đang ở đúng chặng của mình — cứ tiếp tục nhé.";
      $("setresult").innerHTML = '<div class="fb ok" style="display:block"><b>Hoàn thành bộ ' + (curSet === "Y" ? "Khởi động" : curSet === "G" ? "Bứt phá" : "Tăng tốc") + '.</b> ' + sug + '</div>';
    }
    function renderSet(){
      var box = $("setbox"); box.innerHTML = ""; $("setresult").innerHTML = "";
      var rep = { done:0, first:0 };
      function report(ft){ rep.done++; if(ft) rep.first++; if(rep.done === 4) finishSet(rep); }
      function sMcq(bid, fid, opts, key, okT, noT){
        var wrongs = 0, doneIt = false;
        var bx = document.getElementById(bid); bx.innerHTML = "";
        opts.forEach(function(t, i){
          var b = document.createElement("button"); b.className = "opt"; b.innerHTML = t;
          b.onclick = function(){
            if(doneIt) return;
            bx.querySelectorAll(".opt").forEach(function(x){ x.classList.remove("sel","right","wrong"); });
            if(i === key){ b.classList.add("right"); fb($(fid), true, okT); doneIt = true; report(wrongs === 0); }
            else { b.classList.add("wrong"); wrongs++; fb($(fid), false, noT); }
          };
          bx.appendChild(b);
        });
        renderK(bx);
      }
      function sFill(bid, fid, fn, okT, noT){
        var tried = false;
        $(bid).onclick = function(){
          var ok = fn();
          if(ok){ fb($(fid), true, okT); if(!tried){ report(true); } tried = true; $(bid).disabled = true; }
          else { fb($(fid), false, noT); if(!tried){ tried = true; report(false); } }
        };
      }
      function q(n, title, inner){ return '<h2>Câu ' + n + '</h2><p>' + title + '</p>' + inner; }
      if(curSet === "Y"){
        box.innerHTML =
          q(1, "Ghép thẻ: mỗi hệ số k cho vectơ tích thế nào?", '<div id="sy_slots"></div><div class="bank" id="sy_bank"></div><div class="fb" id="sy_fb"></div>')
          + q(2, "Nếu " + LEN("\\vec{a}") + " = 2 thì " + LEN("3\\vec{a}") + " bằng:", '<div class="opts" id="sy2"></div><div class="fb" id="fsy2"></div>')
          + q(3, "Mệnh đề “vectơ " + K("-\\vec{a}") + " cùng hướng với " + V1("a") + "” là:", '<div class="opts" id="sy3"></div><div class="fb" id="fsy3"></div>')
          + q(4, "Đòn cân bằng với bộ 1 kg – 2 kg khi AM : MB = <input class='num' id='sy41' style='width:70px'> : <input class='num' id='sy42' style='width:70px'> <button class='btn' id='sy4b'>Kiểm tra</button>", '<div class="fb" id="fsy4"></div>');
        matchDnD("sy",
          [ { label:K("k = 2"), need:"c2" }, { label:K("k = -1"), need:"c1" }, { label:K("k = 0"), need:"c0" } ],
          [ { id:"c1", html:"Ngược hướng, dài bằng nhau" }, { id:"c0", html:"Bằng vectơ-không " + V1("0") }, { id:"c2", html:"Cùng hướng, dài gấp đôi" } ],
          function(){ report(true); });
        sMcq("sy2","fsy2", ["−6","6","2"], 1, "Đúng! |3| · 2 = 6.", "Chưa đúng. Độ dài luôn dương và bằng |k| nhân độ dài gốc.");
        sMcq("sy3","fsy3", ["Đúng","Sai"], 1, "Đúng là mệnh đề Sai — hệ số âm thì ngược hướng.", "Chưa đúng. Nhớ lại bảng quan sát ở MH-04.");
        sFill("sy4b","fsy4", function(){ return numVal("sy41") === 2 && numVal("sy42") === 1; }, "Đúng! AM : MB = 2 : 1.", "Chưa đúng. Tỉ số đảo ngược với khối lượng: vật 2 kg nặng gấp đôi nên điểm cân bằng gần nó hơn.");
      } else if(curSet === "TBK"){
        box.innerHTML =
          q(1, "Biết " + OV("MN") + " = " + K("-\\dfrac{3}{2}\\overrightarrow{AB}") + ". Khẳng định nào đúng?", '<div class="opts" id="st1"></div><div class="fb" id="fst1"></div>')
          + q(2, "Đúng / Sai — phán quyết cả bốn mệnh đề:", '<div id="st2"></div><div class="fb" id="fst2"></div>')
          + q(3, "Tam giác có trung tuyến AM = 15 cm. Điền AG = <input class='num' id='st3'> cm <button class='btn' id='st3b'>Kiểm tra</button>", '<div class="fb" id="fst3"></div>')
          + q(4, "Kéo các thẻ để sắp xếp bốn bước giải Ví dụ 3 theo đúng thứ tự:", '<div class="chips" id="st4"></div><div class="fb" id="fst4"></div>');
        sMcq("st1","fst1", [OV("MN") + " có độ dài \\(\\dfrac{3}{2}\\)AB, cùng hướng với " + OV("AB"), OV("MN") + " có độ dài \\(\\dfrac{3}{2}\\)AB, ngược hướng với " + OV("AB"), OV("MN") + " có độ dài \\(\\dfrac{2}{3}\\)AB, ngược hướng với " + OV("AB"), OV("MN") + " và " + OV("AB") + " không cùng phương"], 1,
          "Đúng! Hệ số âm → ngược hướng; độ dài bằng \\(\\dfrac{3}{2}\\)AB.", "Chưa đúng. Xét dấu của hệ số trước (hướng), rồi mới xét độ dài.");
        var items = [
          { t:"a) " + K("(-1)\\vec{a}") + " là vectơ đối của " + V1("a") + ".", ans:true },
          { t:"b) " + LEN("-\\dfrac{1}{2}\\vec{a}") + " = " + K("-\\dfrac{1}{2}") + LEN("\\vec{a}") + ".", ans:false },
          { t:"c) Với I là trung điểm của AB: " + OV("OA") + " + " + OV("OB") + " = " + K("2\\overrightarrow{OI}") + " với mọi điểm O.", ans:true },
          { t:"d) Điểm M thỏa " + OV("MA") + " + " + OV("MB") + " + " + K("2\\overrightarrow{MC}") + " = " + V1("0") + " là trung điểm của đoạn AB.", ans:false }
        ];
        var dsbox = $("st2"), state = [null,null,null,null], dsReported = false, dsFirstDone = false;
        items.forEach(function(it, i){
          var row = document.createElement("div"); row.className = "dsrow";
          row.innerHTML = "<div style='flex:1;min-width:220px'>" + it.t + "</div>";
          var bs = document.createElement("div"); bs.className = "dsbtns";
          [["Đúng", true], ["Sai", false]].forEach(function(pair){

            b.onclick = function(){
              state[i] = pair[1];
              bs.querySelectorAll("button").forEach(function(x){ x.className = ""; });
              b.className = pair[1] ? "selD" : "selS";
              if(state.every(function(x){ return x !== null; })){
                var allOk = items.every(function(x, j){ return state[j] === x.ans; });
                if(allOk){ fb($("fst2"), true, "Đúng cả bốn mệnh đề!"); if(!dsReported){ dsReported = true; report(!dsFirstDone); } }
                else { fb($("fst2"), false, "Chưa đúng hết — kiểm tra mệnh đề b (độ dài âm?) và mệnh đề d (M là điểm nào?)."); dsFirstDone = true; }
              }
            };
            bs.appendChild(b);
          });
          row.appendChild(bs); dsbox.appendChild(row);
        });
        renderK(dsbox);
        sFill("st3b","fst3", function(){ return Math.abs(numVal("st3") - 10) < 0.001; }, "Đúng! AG = \\(\\dfrac{2}{3}\\) · 15 = 10 cm.", "Chưa đúng. Trọng tâm chia trung tuyến theo tỉ số AG : GM = 2 : 1.");
        var steps = [
          "Chèn điểm A: " + OV("MB") + " = " + OV("MA") + " + " + OV("AB") + ", " + OV("MC") + " = " + OV("MA") + " + " + OV("AC"),
          "Cộng lại: " + K("6\\overrightarrow{MA} + 3\\overrightarrow{AB} + 2\\overrightarrow{AC} = \\vec{0}"),
          "Chuyển vế, đổi dấu: " + OV("AM") + " = " + K("\\dfrac{1}{2}\\overrightarrow{AB} + \\dfrac{1}{3}\\overrightarrow{AC}"),
          "Dựng điểm M: đỉnh thứ tư của hình bình hành EAFM"
        ];
        var st4Wrongs = 0;
        sortChips("st4", "fst4", steps, [1, 3, 0, 2], "Đúng thứ tự!", function(){ report(st4Wrongs === 0); },
          { onAttempt: function(ok){ if(!ok) st4Wrongs++; } });
      } else {
        box.innerHTML =
          q(1, "Cho " + LEN("\\vec{a}") + " = 3, vectơ " + K("k\\vec{a}") + " ngược hướng với " + V1("a") + " và " + LEN("k\\vec{a}") + " = 12. Điền k = <input class='num' id='sg1'> <button class='btn' id='sg1b'>Kiểm tra</button>", '<div class="fb" id="fsg1"></div>')
          + q(2, "Đòn AB = 12, vật 2 kg ở A và 1 kg ở B. Điền AM = <input class='num' id='sg2'> <button class='btn' id='sg2b'>Kiểm tra</button>", '<div class="fb" id="fsg2"></div>')

    var errLine = "";
    if(S.err){ errLine = '<p>Ở MH-17, em đã tự phân tích câu sai <b>' + S.err.item + '</b>: nguyên nhân thuộc nhóm <b>' + ERR_CAUSES[S.err.cause] + '</b> — bước em sẽ đổi: <i>“' + S.err.fix.replace(/</g, "&lt;") + '”</i>. Hãy nhớ nhóm lỗi này khi sang bài tiếp theo.</p>'; }
    h += '<h2>Nhìn lại cách em học — siêu nhận thức</h2>'
    + '<p>Ở MH-03, em dự đoán <b>' + predTxt + '</b>' + (confTxt ? ' với mức tin cậy: <b>' + confTxt + '</b>' : '') + '. ' + cal + '</p>'
    + stratLine + errLine
    + (S.plan16 ? '<p><b>Chiến lược đó hiệu quả đến đâu?</b></p><div class="opts" id="planEff"></div>' : '')
    + '<p><b>Ba câu hỏi mang theo cho mọi bài toán sau:</b> (1) Đáp số có hợp lí không — độ dài có bị âm không, hướng có khớp dấu của k không? (2) Mình đã xét đủ điều kiện chưa? (3) Lỗi này mình đã từng mắc chưa?</p>'
    + '<p>Viết một câu cho chính em — <i>lần tới, trước khi chốt đáp án, em sẽ tự hỏi mình điều gì?</i></p>'
    + '<textarea id="refl" rows="2" style="width:100%;border:1.5px solid #c9d6e3;border-radius:10px;padding:9px;font:inherit" placeholder="Em viết câu tự hỏi của riêng mình vào đây...">' + (S.reflection || "").replace(/</g, "&lt;") + '</textarea>';
    h += '<h2>Video V6 — Khép vòng và tổng kết</h2>' + vidHtml("V6-Khep-vong.mp4", "V6-Khep-vong.vtt")
    + '<h2>Tổng kết bài — bấm vào từng thẻ</h2>'
    + '<div class="opts"><button class="opt" data-s="0">1 · Hướng và độ dài của ' + K("k\\vec{a}") + '</button><button class="opt" data-s="1">2 · Tính chất và hai đẳng thức đặc trưng</button><button class="opt" data-s="2">3 · Phân tích vectơ để tìm điểm</button></div>'
    + '<div class="fb" id="sumfb"></div>'
    + '<h2>Báo cáo năng lực của em</h2><p style="color:#5a6b7d;font-size:14.5px">Báo cáo này là <b>chỉ báo tham khảo</b>, được suy từ mức hoàn thành các màn hình và kết quả làm bài trong gói học này — không phải kết quả đánh giá năng lực chính thức.</p><div id="compbox"></div>'
    + '<table class="kq"><tr><th>Hạng mục</th><th>Kết quả</th></tr>'
    + '<tr><td>Chặng học</td><td>' + (S.tier ? tierName() : "—") + (S.ch13 ? ' · luyện tập chặng: đúng ngay lần đầu ' + Math.round(S.ch13.pct * 4) + '/4 câu (bộ ' + (S.ch13.tier === "Y" ? "Khởi động" : S.ch13.tier === "G" ? "Bứt phá" : "Tăng tốc") + ')' : '') + '</td></tr>'
    + '<tr><td>Điểm kiểm tra lượt đầu (MH-17)</td><td>' + (S.test.first >= 0 ? S.test.first.toFixed(1) + " / 10" : "chưa làm") + '</td></tr>'
    + '<tr><td>Điểm kiểm tra cao nhất (MH-17)</td><td>' + (S.test.best >= 0 ? S.test.best.toFixed(1) + " / 10" : "chưa làm") + '</td></tr>'
    + '<tr><td>Trạng thái</td><td>' + (S.test.passed ? "ĐÃ ĐẠT (từ 80%) ✔" : "Chưa đạt — hãy quay lại MH-17 làm lại") + '</td></tr></table>'
    + '<h2>Bài tập về nhà theo chặng của em</h2><p>' + TB("Bài 4.11 và 4.12a (SGK trang 59).", "Bài 4.11, 4.12a, 4.13 và 4.15 (SGK trang 59).", "Bài 4.11, 4.12a, 4.13, 4.15 và 4.14 (SGK trang 59) — cùng thử thách ở MH-16.") + '</p>'
    + '<p><button class="btn" id="finishBtn">Kết thúc bài học</button></p><div class="fb" id="ffin"></div>';
    return h; },
  setup:function(){
    var pe = $("planEff");
    if(pe){
      var effs = ["Hiệu quả — em tới được đáp án", "Dùng được một phần", "Không hiệu quả — lần sau đổi cách khác"];
      effs.forEach(function(t, i){
        var b = document.createElement("button"); b.className = "opt" + (S.planEff === i ? " sel" : ""); b.textContent = t;
        b.onclick = function(){ S.planEff = i; pe.querySelectorAll(".opt").forEach(function(x){ x.classList.remove("sel"); }); b.classList.add("sel"); persist(); };
        pe.appendChild(b);
      });
    }
    var reflEl = $("refl");
    if(reflEl){ reflEl.addEventListener("input", function(){ S.reflection = reflEl.value; persist(); }); }
    var txt = [
      "k > 0: cùng hướng; k < 0: ngược hướng; k = 0: vectơ không. Độ dài " + LEN("k\\vec{a}") + " = " + LEN("k") + " · " + LEN("\\vec{a}") + ".",
      "Bốn tính chất (kết hợp, phân phối hai chiều, 1 và −1). Trung điểm: " + OV("IA") + " + " + OV("IB") + " = " + V1("0") + ". Trọng tâm: " + OV("GA") + " + " + OV("GB") + " + " + OV("GC") + " = " + V1("0") + ".",
      "Mọi vectơ phân tích được duy nhất theo hai vectơ không cùng phương. Muốn tìm điểm: chọn gốc, chèn điểm, chuyển vế — như Ví dụ 3 và bài 4.13a."
    ];
    document.querySelectorAll("[data-s]").forEach(function(b){
      b.onclick = function(){ b.classList.add("sel"); fb($("sumfb"), true, txt[parseInt(b.dataset.s, 10)]); };
    });
    /* --- bao cao nang luc --- */
    function frac(ids){
      var num = 0, den = 0;
      ids.forEach(function(id){
        if(id === "mh17"){ den += 1; num += S.test.passed ? 1 : (S.test.attempts > 0 ? 0.5 : 0); }
        else if(id === "mh16"){ if(S.done.mh16){ den += 1; num += 1; } else if(mh16Unlocked()){ den += 1; } }
        else { den += 1; if(S.done[id]) num += 1; }
      });
      return den ? num / den : 0;
    }
    var comps = [
      ["Tư duy và lập luận toán học", frac(["mh02","mh06","mh07","mh08","mh15"])],
      ["Mô hình hoá toán học", frac(["mh03","mh10","mh14"])],
      ["Giải quyết vấn đề toán học", frac(["mh12","mh13","mh16","mh17"])],
      ["Giao tiếp toán học", frac(["mh01","mh05","mh09"])],
      ["Sử dụng công cụ, phương tiện học toán", frac(["mh04","mh10","mh11"])]
    ];
    var h = "";
    comps.forEach(function(c){
      var lvl = c[1] >= 0.7 ? "Đạt" : (c[1] >= 0.4 ? "Đang phát triển" : "Cần cố gắng");
      h += '<div class="comp"><div class="cl"><span>' + c[0] + '</span><b>' + lvl + '</b></div><div class="bar"><i style="width:' + Math.round(c[1] * 100) + '%"></i></div></div>';
    });
    var sims = (S.done.mh03 ? 1 : 0) + (S.done.mh04 ? 1 : 0) + (S.done.mh10 ? 1 : 0);
    var stops = Object.keys(S.vstops).length;
    h += '<div class="comp"><div class="cl"><span>Năng lực số — thao tác mô phỏng và video tương tác</span><b>' + (sims >= 3 ? "Đạt" : sims >= 1 ? "Đang phát triển" : "Cần cố gắng") + '</b></div><div class="bar"><i style="width:' + Math.round((sims / 3) * 100) + '%"></i></div></div>'
      + '<p style="font-size:14.5px;color:#44536a">Đã hoàn thành ' + sims + '/3 mô phỏng khám phá và trả lời ' + stops + '/5 điểm dừng video.</p>';
    h += '<div class="comp"><div class="cl"><span>Năng lực AI — kiểm chứng đầu ra của AI</span><b>' + (S.done.mh15 ? "Đạt" : "Chưa thực hiện") + '</b></div><div class="bar"><i style="width:' + (S.done.mh15 ? 100 : 0) + '%"></i></div></div>'
      + '<p style="font-size:14.5px;color:#44536a">' + (S.done.mh15 ? "Đã phán quyết đúng 4/4 lời giải của trợ lí AI ở MH-15: sửa đúng 3 lời giải sai và công nhận đúng 1 lời giải đúng." : "Hãy quay lại MH-15 (Góc AI) để rèn kĩ năng kiểm chứng lời giải của AI.") + '</p>';
    $("compbox").innerHTML = h;
    markDone("mh18");
    if(SCORM.isActive()){ SCORM.set("cmi.core.lesson_status", S.test.passed ? "passed" : "completed"); SCORM.save(); }
    $("finishBtn").onclick = function(){
      persist();
      if(SCORM.isActive()){ SCORM.set("cmi.core.lesson_status", S.test.passed ? "passed" : "completed"); SCORM.save(); SCORM.finish(); }
      fb($("ffin"), true, "Đã ghi lại kết quả học tập. Em có thể đóng cửa sổ này.");
    };
  }});
</script>
<script>
"use strict";
/* ---------- Bo may dieu huong ---------- */
var stage = $("stage"), menuList = $("menulist"), prevBtn = $("prev"), nextBtn = $("next"), counter = $("counter");
var toast = document.createElement("div");
toast.style.cssText = "position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:#1a1a2e;color:#fff;padding:10px 18px;border-radius:10px;font-size:15px;display:none;z-index:50;max-width:90vw;text-align:center";
document.body.appendChild(toast);
var toastTimer = null;
function showToast(msg){ toast.textContent = msg; toast.style.display = "block"; clearTimeout(toastTimer); toastTimer = setTimeout(function(){ toast.style.display = "none"; }, 2600); }
function renderMenu(){
var MENU_TITLES = {
  mh01:"Mở đầu và mục tiêu", mh02:"Chẩn đoán đầu vào", mh03:"Tình huống có vấn đề",
  mh04:"Kéo vectơ, trượt k", mh05:"Ý tưởng nhân vectơ", mh06:"Định nghĩa tích vectơ–số",
  mh07:"Bốn tính chất", mh08:"Luyện tập Đúng – Sai", mh09:"Trung điểm và trọng tâm",
  mh10:"Đòn cân bằng", mh11:"Phân tích vectơ trên lưới", mh12:"Xác định điểm M",
  mh13:"Luyện tập theo chặng", mh14:"Vận dụng lực cân bằng", mh15:"Góc AI: Kiểm chứng",
  mh16:"Thử thách nâng cao", mh17:"Kiểm tra cuối bài", mh18:"Tổng kết và báo cáo"
};
  menuList.innerHTML = "";
  SCREENS.forEach(function(sc, i){
    var b = document.createElement("button");
    b.className = "mi" + (i === S.cur ? " cur" : "") + (S.done[sc.id] ? " done" : "") + (i > S.max ? " lock" : "");
    b.innerHTML = '<span class="n">' + (S.done[sc.id] ? "✓" : (i + 1)) + '</span><span>' + (MENU_TITLES[sc.id] || sc.title) + '</span>';
    b.onclick = function(){
      if(i > S.max){ showToast("Hãy học lần lượt theo thứ tự — màn hình này chưa mở."); return; }
      go(i);
      document.getElementById("menu").classList.remove("open");
    };
    menuList.appendChild(b);
  });
}
function updateNav(){
  prevBtn.disabled = S.cur === 0;
  nextBtn.style.visibility = S.cur === SCREENS.length - 1 ? "hidden" : "visible";
  counter.textContent = "Màn hình " + (S.cur + 1) + " / " + SCREENS.length;
  var doneCount = SCREENS.filter(function(sc){ return S.done[sc.id]; }).length;
  document.querySelector("#progress i").style.width = Math.round(doneCount / SCREENS.length * 100) + "%";
}
function go(i){
  S.cur = i; if(i > S.max) S.max = i;
  var sc = SCREENS[i];
  stage.innerHTML = sc.html();
  if(sc.setup) sc.setup();
  stage.querySelectorAll(".speakbtn").forEach(function(b){ b.onclick = function(){ speakNarr(b); }; });
  stage.querySelectorAll(".narr[data-audio]").forEach(function(nr){
    var b = nr.querySelector(".speakbtn"); if(!b) return;
    var a = document.createElement("audio");
    a.controls = true; a.preload = "none"; a.src = nr.getAttribute("data-audio");
    a.style.cssText = "width:100%;margin-top:8px;height:38px";
    a.setAttribute("aria-label", "Thuyết minh của thầy Phúc");
    b.replaceWith(a);
  });
  renderK(stage);
  renderMenu(); updateNav(); updateTierBadge(); persist();
  window.scrollTo({ top: 0 });
}
prevBtn.onclick = function(){ if(S.cur > 0) go(S.cur - 1); };
nextBtn.onclick = function(){
  var sc = SCREENS[S.cur];
  if(sc.gate && !sc.gate()){ showToast("Hãy hoàn thành yêu cầu trên màn hình này trước khi đi tiếp."); return; }
  if(S.cur < SCREENS.length - 1) go(S.cur + 1);
};
$("menubtn").onclick = function(){ document.getElementById("menu").classList.toggle("open"); };
window.addEventListener("beforeunload", function(){ persist(); });
SCORM.init();
restore();
if(S.test.first === undefined) S.test.first = -1;
if(S.test.lastItems === undefined) S.test.lastItems = null;
if(S.test.note === undefined) S.test.note = "";
if(S.conf03 === undefined) S.conf03 = null;
if(S.reflection === undefined) S.reflection = "";
if(S.plan16 === undefined) S.plan16 = null;
if(S.planEff === undefined) S.planEff = null;
if(S.err === undefined) S.err = null;
if(S.max === undefined || S.max === null) S.max = S.cur || 0;
S.max = 17; S.tier = S.tier || "G"; S.challenge = true;
SCREENS.forEach(function(sc){ sc.gate = function(){ return true; }; });
go(S.cur || 0);
</script>
</body>
</html>
