<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mô phỏng 3D — Con tàu quay đầu gấp đôi (Bài 9)</title>
<link rel="stylesheet" href="../katex/katex.min.css">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;font-family:"Segoe UI",Arial,sans-serif;background:#dceefb;overflow:hidden}
  #scene{position:absolute;inset:0}
  #hud{position:absolute;top:10px;left:10px;background:#fffffff2;border:1.5px solid #0b5394;border-radius:12px;padding:10px 14px;max-width:min(430px,92vw);box-shadow:0 2px 10px #0002}
  #hud h1{font-size:16.5px;color:#083d6b;margin-bottom:2px}
  #phase{font-size:14.5px;color:#1a1a2e}
  #bar{position:absolute;left:50%;transform:translateX(-50%);bottom:10px;background:#fffffff2;border:1.5px solid #0b5394;border-radius:12px;padding:8px 10px;display:flex;gap:7px;flex-wrap:wrap;justify-content:center;align-items:center;max-width:96vw;box-shadow:0 2px 10px #0002}
  #bar button{border:1.5px solid #0b5394;background:#fff;color:#0b5394;border-radius:9px;padding:7px 12px;font-size:14.5px;font-weight:600;cursor:pointer}
  #bar button.main{background:#0b5394;color:#fff}
  #bar button.on{background:#ffd966;border-color:#b8860b;color:#5b4300}
  #bar label{font-size:14px;display:flex;gap:5px;align-items:center;cursor:pointer}
  #prog{position:absolute;left:0;right:0;bottom:0;height:5px;background:#ffffff88}
  #prog i{display:block;height:100%;width:0;background:#0b5394}
  .vec{display:inline-flex;flex-direction:column;align-items:center;line-height:1.02;vertical-align:middle;font-weight:600;font-style:italic}
  .vec .arr{font-size:.58em;line-height:.42;margin-bottom:-.18em;font-style:normal;font-weight:400}
  .note{position:absolute;right:10px;top:10px;font-size:12.5px;color:#33536e;background:#ffffffcc;border-radius:8px;padding:4px 9px}
  @media (max-width:640px){ #hud h1{font-size:15px} #phase{font-size:13.5px} .note{display:none} }
</style>
</head>
<body>
<div id="scene"></div>
<div id="hud">
  <h1>🚢 Con tàu quay đầu gấp đôi — Bài 9</h1>
  <div id="phase">Bấm <b>Chạy hành trình</b> để xem con tàu di chuyển. Kéo chuột để xoay góc nhìn, lăn chuột để phóng to.</div>
</div>
<div class="note">Sơ đồ không theo tỉ lệ · 1 ô lưới = 1 km</div>
<div id="bar">
  <button id="play" class="main">▶ Chạy hành trình</button>
  <button id="replay">↺ Chạy lại</button>
  <button id="speed">Tốc độ ×1</button>
  <button id="camTop">Góc nhìn từ trên</button>
  <button id="cam3d" class="on">Góc nhìn 3D</button>
  <label id="wrapVec"><input type="checkbox" id="chkVec" checked> Hiện vectơ chặng</label>
  <label id="wrapAns"><input type="checkbox" id="chkAns"> Hiện độ dời (đáp án)</label>
</div>
<div id="prog"><i></i></div>
<script src="../katex/katex.min.js"></script>
<script src="three.min.js"></script>
<script src="OrbitControls.js"></script>
<script>
"use strict";
var MODE = new URLSearchParams(location.search).get("mode") || "standalone"; // hook | answer | standalone
/* ================= Canh nen ================= */
var container = document.getElementById("scene");
var scene = new THREE.Scene();
scene.background = new THREE.Color(0xcfe8fa);
scene.fog = new THREE.Fog(0xcfe8fa, 26, 46);
var camera = new THREE.PerspectiveCamera(46, innerWidth / innerHeight, 0.1, 200);
camera.position.set(6.8, 6.2, 9.5);
var renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
container.appendChild(renderer.domElement);
var controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.maxPolarAngle = Math.PI * 0.49; controls.minDistance = 4; controls.maxDistance = 30;
scene.add(new THREE.AmbientLight(0xffffff, 0.75));
var sun = new THREE.DirectionalLight(0xffffff, 0.85);
sun.position.set(8, 14, 6); scene.add(sun);

/* Mat nuoc + luoi km */
var water = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.MeshPhongMaterial({ color: 0x2e7fc2, transparent: true, opacity: 0.82, shininess: 120 }));
water.rotation.x = -Math.PI / 2; water.position.y = -0.06; scene.add(water);
var grid = new THREE.GridHelper(16, 16, 0xffffff, 0x9fc6e8);
grid.material.transparent = true; grid.material.opacity = 0.55; grid.position.y = 0.0; scene.add(grid);
/* Duong dong-tay chinh (z=0) noi bat */
var mainLineGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(-8, 0.02, 0), new THREE.Vector3(8, 0.02, 0)]);
scene.add(new THREE.Line(mainLineGeo, new THREE.LineBasicMaterial({ color: 0xffffff })));

/* Nhan chu bang canvas sprite */
function makeLabel(text, opts) {
  opts = opts || {};
  var fs = opts.fs || 44, pad = 18;
  var segs = [], re = /\{([^}]+)\}/g, m, last = 0;
  while ((m = re.exec(text)) !== null) {
    if (m.index > last) segs.push({ t: text.slice(last, m.index), vec: false });
    segs.push({ t: m[1], vec: true }); last = m.index + m[0].length;
  }
  if (last < text.length) segs.push({ t: text.slice(last), vec: false });
  var cv = document.createElement("canvas"), cx = cv.getContext("2d");
  var font = "700 " + fs + "px 'Segoe UI', Arial, sans-serif";
  var fontVec = "italic 700 " + fs + "px 'Times New Roman', 'Segoe UI', serif";
  var widths = segs.map(function (sg) { cx.font = sg.vec ? fontVec : font; return cx.measureText(sg.t).width; });
  var total = widths.reduce(function (a, b) { return a + b; }, 0);
  cv.width = Math.ceil(total) + pad * 2; cv.height = fs + pad * 2;
  cx = cv.getContext("2d");
  if (opts.bg) { cx.fillStyle = opts.bg; cx.beginPath(); cx.roundRect(0, 0, cv.width, cv.height, 16); cx.fill(); }
  cx.fillStyle = opts.color || "#083d6b"; cx.textBaseline = "middle"; cx.textAlign = "left";
  var x = pad, cy = cv.height / 2 + 2;
  segs.forEach(function (sg, i) {
    cx.font = sg.vec ? fontVec : font;
    cx.fillText(sg.t, x, cy);
    if (sg.vec) {
      // Mui ten kieu SGK: om sat tren dau chu, truc vua bang be rong chu, dau mui ten tam giac dac o dau phai
      var yT = cy - fs * 0.44, x0 = x + widths[i] * 0.03, x1 = x + widths[i] * 0.99;
      var col = opts.color || "#083d6b";
      cx.strokeStyle = col; cx.fillStyle = col; cx.lineWidth = Math.max(2, fs * 0.062);
      cx.beginPath(); cx.moveTo(x0, yT); cx.lineTo(x1 - fs * 0.10, yT); cx.stroke();
      cx.beginPath(); cx.moveTo(x1, yT); cx.lineTo(x1 - fs * 0.21, yT - fs * 0.105); cx.lineTo(x1 - fs * 0.21, yT + fs * 0.105); cx.closePath(); cx.fill();
      cx.fillStyle = opts.color || "#083d6b";
    }
    x += widths[i];
  });
  var tex = new THREE.CanvasTexture(cv); tex.anisotropy = 4;
  var sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthTest: false, transparent: true, sizeAttenuation: !opts.fixed }));
  var h = opts.h || 0.62; sp.scale.set(h * cv.width / cv.height, h, 1); sp.renderOrder = 50;
  return sp;
}
function addLabel(text, x, y, z, opts) { var s = makeLabel(text, opts); s.position.set(x, y, z); scene.add(s); return s; }
addLabel("ĐÔNG →", 8.8, 0.9, -0.9, { bg: "#ffffffdd", fixed: true, h: 0.085 });
addLabel("← TÂY", -8.8, 0.9, -0.9, { bg: "#ffffffdd", fixed: true, h: 0.085 });
addLabel("BẮC ↑", 0.9, 0.9, -8.8, { bg: "#ffffffdd", fixed: true, h: 0.085 });
addLabel("NAM ↓", 0.9, 0.9, 8.8, { bg: "#ffffffdd", fixed: true, h: 0.085 });
for (var km = -6; km <= 6; km += 3) { if (km !== 0) addLabel(Math.abs(km) + " km", km, 0.35, 0.85, { fs: 34, color: "#ffffff", h: 0.4 }); }

/* Phao diem xuat phat */
var buoy = new THREE.Group();
var buoyBody = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.22, 0.42, 12), new THREE.MeshPhongMaterial({ color: 0xe65100 }));
buoyBody.position.y = 0.21; buoy.add(buoyBody);
var buoyPole = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.8, 8), new THREE.MeshPhongMaterial({ color: 0x37474f }));
buoyPole.position.y = 0.75; buoy.add(buoyPole);
var buoyFlag = new THREE.Mesh(new THREE.PlaneGeometry(0.44, 0.26), new THREE.MeshBasicMaterial({ color: 0xffd966, side: THREE.DoubleSide }));
buoyFlag.position.set(0.24, 1.02, 0); buoy.add(buoyFlag);
scene.add(buoy);
addLabel("Điểm xuất phát", 0, 1.65, 0, { bg: "#ffd966ee", fs: 40, h: 0.55 });

/* ================= Con tau (dung tu khoi co ban) ================= */
var ship = new THREE.Group();
(function buildShip() {
  var navy = new THREE.MeshPhongMaterial({ color: 0x0b5394, shininess: 60 });
  var white = new THREE.MeshPhongMaterial({ color: 0xffffff, shininess: 40 });
  var dark = new THREE.MeshPhongMaterial({ color: 0x263238 });
  var red = new THREE.MeshPhongMaterial({ color: 0xc62828 });
  // Than tau: hinh dang nhin tu tren (mui nhon ve +X), dun cao 0.34
  var shape = new THREE.Shape();
  shape.moveTo(-0.85, -0.26); shape.lineTo(0.35, -0.26); shape.lineTo(0.95, 0); shape.lineTo(0.35, 0.26); shape.lineTo(-0.85, 0.26); shape.closePath();
  var hullGeo = new THREE.ExtrudeGeometry(shape, { depth: 0.34, bevelEnabled: false });
  var hull = new THREE.Mesh(hullGeo, navy); hull.rotation.x = -Math.PI / 2; hull.position.y = 0.36; ship.add(hull);
  var deck = new THREE.Mesh(new THREE.BoxGeometry(1.15, 0.07, 0.4), white);
  deck.position.set(-0.12, 0.72, 0); ship.add(deck);
  var cabin = new THREE.Mesh(new THREE.BoxGeometry(0.52, 0.34, 0.36), white);
  cabin.position.set(-0.18, 0.9, 0); ship.add(cabin);
  var winStrip = new THREE.Mesh(new THREE.BoxGeometry(0.54, 0.1, 0.38), dark);
  winStrip.position.set(-0.18, 0.97, 0); ship.add(winStrip);
  var funnel = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.11, 0.34, 12), dark);
  funnel.position.set(-0.52, 0.9, 0); ship.add(funnel);
  var funnelTop = new THREE.Mesh(new THREE.CylinderGeometry(0.095, 0.095, 0.07, 12), red);
  funnelTop.position.set(-0.52, 1.1, 0); ship.add(funnelTop);
  var mast = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.72, 8), dark);
  mast.position.set(0.42, 1.08, 0); ship.add(mast);
  var flag = new THREE.Mesh(new THREE.PlaneGeometry(0.34, 0.2), new THREE.MeshBasicMaterial({ color: 0xffd966, side: THREE.DoubleSide }));
  flag.position.set(0.6, 1.34, 0); ship.add(flag);
  ship.userData.flag = flag;
})();
scene.add(ship);

/* ================= Vecto mui ten ================= */
function makeArrow(color) {
  var a = new THREE.ArrowHelper(new THREE.Vector3(1, 0, 0), new THREE.Vector3(0, 0.6, 0), 0.01, color, 0.3, 0.18);
  a.visible = false; scene.add(a); return a;
}
var arrowA = makeArrow(0x1565c0);   arrowA.position.set(0, 0.6, -0.62);
var arrowB = makeArrow(0xc62828);   arrowB.position.set(3, 0.6, 0.62);
var arrowNet = makeArrow(0xe69138); arrowNet.position.set(0, 0.95, 0);
var lblA = addLabel("{a} — 3 km về đông", 1.9, 1.02, -0.62, { bg: "#e3f0ffef", fs: 38, h: 0.52 }); lblA.visible = false;
var lblB = addLabel("−2{a} — 6 km về tây", -0.7, 1.3, 0.62, { bg: "#ffe9e9ef", fs: 38, h: 0.52 }); lblB.visible = false;
var lblNet = addLabel("Độ dời = −{a} : 3 km về phía tây", -1.5, 2.2, 0, { bg: "#fff3d6ef", fs: 38, h: 0.55 }); lblNet.visible = false;
/* Co diem cuoi (chi o che do dap an) */
var endFlag = new THREE.Group();
var ep = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 1.15, 8), new THREE.MeshPhongMaterial({ color: 0x37474f }));
ep.position.y = 0.57; endFlag.add(ep);
var ef = new THREE.Mesh(new THREE.PlaneGeometry(0.5, 0.3), new THREE.MeshBasicMaterial({ color: 0xe69138, side: THREE.DoubleSide }));
ef.position.set(0.27, 0.98, 0); endFlag.add(ef);
endFlag.position.set(-3, 0, 0); endFlag.visible = false; scene.add(endFlag);

/* Vet nuoc sau tau */
var TRAIL_MAX = 900;
var trailPos = new Float32Array(TRAIL_MAX * 3), trailCount = 0;
var trailGeo = new THREE.BufferGeometry();
trailGeo.setAttribute("position", new THREE.BufferAttribute(trailPos, 3));
var trail = new THREE.Line(trailGeo, new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.75 }));
trail.frustumCulled = false; scene.add(trail);
function trailPush(p) {
  if (trailCount >= TRAIL_MAX) return;
  trailPos[trailCount * 3] = p.x; trailPos[trailCount * 3 + 1] = 0.03; trailPos[trailCount * 3 + 2] = p.z;
  trailCount++; trailGeo.setDrawRange(0, trailCount); trailGeo.attributes.position.needsUpdate = true;
}
function trailReset() { trailCount = 0; trailGeo.setDrawRange(0, 0); }
</script>
<script>
"use strict";
/* ================= Hanh trinh ================= */
var DUR = { leg1: 8, turn: 3.5, leg2: 16 };
var TOTAL = DUR.leg1 + DUR.turn + DUR.leg2;
var T = { playing: false, t: 0, speed: 1, finished: false };
var phaseEl = document.getElementById("phase");
var playBtn = document.getElementById("play");
var progEl = document.querySelector("#prog i");
var chkVec = document.getElementById("chkVec");
var chkAns = document.getElementById("chkAns");
if (MODE === "hook") { document.getElementById("wrapAns").style.display = "none"; }
if (MODE === "answer") { chkAns.checked = true; }

function smooth(p) { return p * p * (3 - 2 * p); }
function stateAt(t) {
  if (t <= DUR.leg1) { var p = t / DUR.leg1; return { x: 3 * p, heading: 0, seg: "leg1" }; }
  t -= DUR.leg1;
  if (t <= DUR.turn) { var p2 = t / DUR.turn; return { x: 3, heading: Math.PI * smooth(p2), seg: "turn" }; }
  t -= DUR.turn;
  var p3 = Math.min(t / DUR.leg2, 1); return { x: 3 - 6 * p3, heading: Math.PI, seg: p3 >= 1 ? "done" : "leg2" };
}
function KX(tex) {
  return window.katex ? '<span style="white-space:nowrap">' + window.katex.renderToString(tex, { throwOnError: false }) + '</span>' : tex;
}
var PHASE_TXT = {
  idle: "Bấm <b>Chạy hành trình</b> để xem con tàu di chuyển. Kéo chuột để xoay góc nhìn, lăn chuột để phóng to.",
  leg1: "Chặng 1: tàu đi <b>3 km về phía đông</b> — đây là vectơ " + KX("\\vec{a}") + ".",
  turn: "Tàu <b>quay đầu 180°</b> tại điểm cách xuất phát 3 km về phía đông.",
  leg2: "Chặng 2: tàu đi ngược lại <b>gấp đôi</b> quãng đường — <b>6 km về phía tây</b> — đây là vectơ " + KX("-2\\vec{a}") + ".",
  doneHook: "Hành trình kết thúc. Theo em, tàu đang ở đâu so với điểm xuất phát? Hãy chọn dự đoán ở câu hỏi bên dưới.",
  doneAnswer: "Độ dời = " + KX("\\vec{a} + (-2\\vec{a}) = -\\vec{a}") + ": tàu ở <b>3 km về phía tây</b> so với điểm xuất phát."
};
var lastSeg = "";
function applyState(now) {
  var st = stateAt(T.t);
  ship.position.set(st.x, 0.03 + Math.sin(now * 0.0022) * 0.02, 0);
  ship.rotation.y = -st.heading;
  ship.rotation.z = Math.sin(now * 0.0018) * 0.015;
  if (ship.userData.flag) ship.userData.flag.rotation.y = Math.sin(now * 0.006) * 0.35;
  if (T.playing && st.seg !== "done") trailPush(ship.position);
  var showVec = chkVec.checked;
  var lenA = st.seg === "leg1" ? Math.max(0, st.x) : 3;
  arrowA.visible = showVec && T.t > 0.1 && lenA > 0.04;
  if (arrowA.visible) arrowA.setLength(lenA, Math.min(0.44, lenA * 0.4), 0.27);
  lblA.visible = arrowA.visible && lenA > 2.2;
  var lenB = (st.seg === "leg2" || st.seg === "done") ? Math.max(0, 3 - st.x) : 0;
  arrowB.visible = showVec && lenB > 0.04;
  if (arrowB.visible) { arrowB.setDirection(new THREE.Vector3(-1, 0, 0)); arrowB.setLength(lenB, Math.min(0.44, lenB * 0.3), 0.27); }
  lblB.visible = arrowB.visible && lenB > 3.4;
  var showAns = chkAns.checked && MODE !== "hook";
  var netLen = Math.abs(st.x);
  arrowNet.visible = showAns && netLen > 0.04;
  if (arrowNet.visible) { arrowNet.setDirection(new THREE.Vector3(Math.sign(st.x) || 1, 0, 0)); arrowNet.setLength(netLen, Math.min(0.5, netLen * 0.35), 0.3); }
  var done = st.seg === "done";
  lblNet.visible = showAns && done;
  endFlag.visible = showAns && done;
  progEl.style.width = (T.t / TOTAL * 100) + "%";
  var key = done ? (MODE === "answer" || chkAns.checked ? "doneAnswer" : "doneHook") : (T.t === 0 && !T.playing ? "idle" : st.seg);
  if (key !== lastSeg && PHASE_TXT[key]) { phaseEl.innerHTML = PHASE_TXT[key]; lastSeg = key; }
  if (done && !T.finished) { T.finished = true; T.playing = false; playBtn.textContent = "↺ Chạy lại"; }
}
function resetJourney() {
  T.t = 0; T.finished = false; T.playing = false; lastSeg = "";
  trailReset(); playBtn.textContent = "▶ Chạy hành trình";
  phaseEl.innerHTML = PHASE_TXT.idle; applyState(performance.now());
}
playBtn.onclick = function () {
  if (T.finished) { resetJourney(); T.playing = true; playBtn.textContent = "⏸ Tạm dừng"; return; }
  T.playing = !T.playing;
  playBtn.textContent = T.playing ? "⏸ Tạm dừng" : "▶ Chạy tiếp";
};
document.getElementById("replay").onclick = function () { resetJourney(); T.playing = true; playBtn.textContent = "⏸ Tạm dừng"; };
var speedBtn = document.getElementById("speed");
speedBtn.onclick = function () { T.speed = T.speed === 1 ? 2 : 1; speedBtn.textContent = "Tốc độ ×" + T.speed; };
chkAns.addEventListener("change", function () { applyState(performance.now()); });
chkVec.addEventListener("change", function () { applyState(performance.now()); });
/* Goc nhin */
var camGoal = null;
function flyTo(pos) { camGoal = { x: pos[0], y: pos[1], z: pos[2] }; }
document.getElementById("camTop").onclick = function () {
  flyTo([0, 13.5, 4.6]);
  this.classList.add("on"); document.getElementById("cam3d").classList.remove("on");
};
document.getElementById("cam3d").onclick = function () {
  flyTo([6.8, 6.2, 9.5]);
  this.classList.add("on"); document.getElementById("camTop").classList.remove("on");
};
/* ================= Vong lap ================= */
var clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  var dt = Math.min(clock.getDelta(), 0.05);
  if (T.playing && !T.finished) { T.t = Math.min(T.t + dt * T.speed, TOTAL); }
  if (camGoal) {
    camera.position.x += (camGoal.x - camera.position.x) * 0.07;
    camera.position.y += (camGoal.y - camera.position.y) * 0.07;
    camera.position.z += (camGoal.z - camera.position.z) * 0.07;
    if (Math.abs(camera.position.x - camGoal.x) < 0.05 && Math.abs(camera.position.y - camGoal.y) < 0.05) camGoal = null;
  }
  controls.update();
  applyState(performance.now());
  renderer.render(scene, camera);
}
addEventListener("resize", function () {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
applyState(performance.now());
animate();
if (MODE === "answer") { setTimeout(function () { T.playing = true; playBtn.textContent = "⏸ Tạm dừng"; }, 700); }
</script>
</body>
</html>
